<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="1020" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="encFlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f5fd0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f5fd0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="decFlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d9622b" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d9622b" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="turbo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#30123b"/>
      <stop offset="0.25" stop-color="#4686fb"/>
      <stop offset="0.5" stop-color="#1ae4b6"/>
      <stop offset="0.75" stop-color="#f9ba38"/>
      <stop offset="1" stop-color="#b41f06"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1018" height="418" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- group titles -->
  <text x="296" y="42" text-anchor="middle" font-size="19" font-weight="600" fill="#2f5fd0">Encoder  E(V)</text>
  <text x="724" y="42" text-anchor="middle" font-size="19" font-weight="600" fill="#d9622b">Decoder  D(c)</text>
  <line x1="170" y1="54" x2="440" y2="54" stroke="#2f5fd0" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="600" y1="54" x2="870" y2="54" stroke="#d9622b" stroke-opacity="0.35" stroke-width="2"/>

  <!-- flows (encoder) -->
  <polygon points="172,130 290,75 290,335 172,290" fill="url(#encFlow)"/>
  <polygon points="312,75 420,160 420,260 312,335" fill="url(#encFlow)"/>
  <polygon points="442,160 504,196 504,224 442,260" fill="url(#encFlow)"/>
  <!-- flows (decoder) -->
  <polygon points="536,196 598,160 598,260 536,224" fill="url(#decFlow)"/>
  <polygon points="620,160 728,75 728,335 620,260" fill="url(#decFlow)"/>
  <polygon points="750,75 868,130 868,290 750,335" fill="url(#decFlow)"/>

  <!-- layers -->
  <rect x="150" y="130" width="22" height="160" rx="6" fill="#1e3a8a"/>
  <rect x="290" y="75"  width="22" height="260" rx="6" fill="#2f5fd0"/>
  <rect x="420" y="160" width="22" height="100" rx="6" fill="#5b8def"/>

  <circle cx="520" cy="210" r="17" fill="url(#turbo)" stroke="#111827" stroke-width="1.5"/>
  <text x="520" y="216" text-anchor="middle" font-size="17" font-style="italic" font-weight="700" fill="#ffffff">c</text>

  <rect x="598" y="160" width="22" height="100" rx="6" fill="#f0955f"/>
  <rect x="728" y="75"  width="22" height="260" rx="6" fill="#d9622b"/>
  <rect x="868" y="130" width="22" height="160" rx="6" fill="#9a3412"/>

  <!-- activation tags -->
  <text x="231" y="215" text-anchor="middle" font-size="12" fill="#1e3a8a" opacity="0.8">LeakyReLU</text>
  <text x="366" y="215" text-anchor="middle" font-size="12" fill="#1e3a8a" opacity="0.8">LeakyReLU</text>
  <text x="674" y="215" text-anchor="middle" font-size="12" fill="#9a3412" opacity="0.8">LeakyReLU</text>
  <text x="809" y="215" text-anchor="middle" font-size="12" fill="#9a3412" opacity="0.8">LeakyReLU</text>

  <!-- dimension labels -->
  <g font-size="16" font-weight="600" fill="#111827" text-anchor="middle">
    <text x="161" y="365">307</text>
    <text x="301" y="365">2601</text>
    <text x="431" y="365">102</text>
    <text x="520" y="365">1</text>
    <text x="609" y="365">102</text>
    <text x="739" y="365">2601</text>
    <text x="879" y="365">307</text>
  </g>
  <text x="520" y="252" text-anchor="middle" font-size="13" fill="#374151">latent</text>

  <!-- input orbit glyph (training orbit, 51 nodes equally spaced in time) -->
  <g transform="translate(70,210)">
    <ellipse cx="0" cy="0" rx="34" ry="62" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <g fill="#1e3a8a">
      <circle cx="0" cy="-62" r="3.2"/><circle cx="17" cy="-53.7" r="3.2"/><circle cx="29.4" cy="-31" r="3.2"/>
      <circle cx="34" cy="0" r="3.2"/><circle cx="29.4" cy="31" r="3.2"/><circle cx="17" cy="53.7" r="3.2"/>
      <circle cx="0" cy="62" r="3.2"/><circle cx="-17" cy="53.7" r="3.2"/><circle cx="-29.4" cy="31" r="3.2"/>
      <circle cx="-34" cy="0" r="3.2"/><circle cx="-29.4" cy="-31" r="3.2"/><circle cx="-17" cy="-53.7" r="3.2"/>
    </g>
    <circle cx="0" cy="-62" r="5" fill="none" stroke="#111827" stroke-width="1.5"/>
  </g>
  <text x="70" y="300" text-anchor="middle" font-size="12" fill="#6b7280">apolune node</text>
  <line x1="108" y1="210" x2="144" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output orbit glyph (decoded orbit) -->
  <g transform="translate(950,210)">
    <ellipse cx="0" cy="0" rx="34" ry="62" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <g fill="#d9622b">
      <circle cx="0.8" cy="-61.4" r="3.2"/><circle cx="16.6" cy="-54.3" r="3.2"/><circle cx="29.9" cy="-30.4" r="3.2"/>
      <circle cx="33.6" cy="0.9" r="3.2"/><circle cx="28.8" cy="31.6" r="3.2"/><circle cx="17.5" cy="53.1" r="3.2"/>
      <circle cx="-0.6" cy="62.5" r="3.2"/><circle cx="-16.4" cy="54.2" r="3.2"/><circle cx="-29.9" cy="30.5" r="3.2"/>
      <circle cx="-33.5" cy="-0.8" r="3.2"/><circle cx="-29" cy="-31.5" r="3.2"/><circle cx="-17.6" cy="-53.2" r="3.2"/>
    </g>
  </g>
  <line x1="896" y1="210" x2="912" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="300" text-anchor="middle" font-size="12" fill="#6b7280">ψ(c, θᵢ)</text>

  <!-- footer -->
  <text x="510" y="400" text-anchor="middle" font-size="14" fill="#4b5563">V = [ x₀ … x₅₀ , T ]  (51 nodes × 6 states + period)   ·   loss = MSE(states) + λ_T · MSE(T)</text>
</svg>
